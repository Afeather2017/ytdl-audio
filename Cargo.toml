[package]
name = "ytdl-audio"
version = "0.2.1"
edition = "2024"
description = "Download YouTube audio, subtitles, and thumbnails"
license = "MIT"
exclude = ["downloads/"]

[lib]
name = "ytdl_audio"
path = "src/lib.rs"

[[bin]]
name = "ytdl-audio"
path = "src/main.rs"

[dependencies]
download-core = { version = "0.1.0", path = "../ncmdump-rs/download-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
urlencoding = "2"
thiserror = "2"
sha1 = "0.10"
reqwest_cookie_store = "0.8"
url = "2"
